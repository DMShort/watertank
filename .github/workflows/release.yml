# Builds and publishes a release (firmware + Windows tool) automatically.
#
#  - Every push to main that changes the firmware, the tool or this workflow
#    becomes the next patch release: v0.4.1 -> v0.4.2 -> ...
#    The release notes (what Dad sees) are the commit messages since the last
#    release, so write those for him.
#  - For a bigger jump, push a tag yourself:  git tag -a v0.5.0 -m "notes"
#    then  git push origin v0.5.0
#  - To push without releasing, put [skip ci] in the commit message.
#    GitHub matches it ANYWHERE in the message (body too), so don't mention
#    it in passing in a commit you do want released.
#
# Copies of the Watershed Tank Tool pick new releases up automatically.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/WatershedTankTool/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch: {}

# one release at a time, in order
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FQBN: esp32:esp32:heltec_wifi_lora_32_V2
  # Keep these the same as your Arduino IDE (Boards Manager / Library Manager)
  # so the release behaves exactly like your bench builds.
  ESP32_CORE: "3.3.13"
  ESPTOOL_VERSION: v4.8.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags -q
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # a tag pushed by hand: use it, and its message as the notes
            TAG="$GITHUB_REF_NAME"
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP/,$d' > release_notes.txt
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              gh release view "$TAG" --json body -q .body > release_notes.txt 2>/dev/null || true
              [ -s release_notes.txt ] || git log -1 --format=%B "$TAG" > release_notes.txt
            fi
          else
            # push to main: next patch version after the newest release tag
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "This commit is already released ($(git tag --points-at HEAD | tr '\n' ' ')), nothing to do."
              echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
            fi
            LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$LAST" ]; then
              TAG=v0.1.0
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              PA="${PA%%[^0-9]*}"
              TAG="v${MA}.${MI}.$(( ${PA:-0} + 1 ))"
            fi
            {
              echo "Changes since ${LAST:-the start}:"
              git log --no-merges --invert-grep --grep='\[skip ci\]' --format='- %s' ${LAST:+$LAST..}HEAD
            } > release_notes.txt
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Releasing $TAG"; echo "Notes:"; cat release_notes.txt

      # ---------- firmware ----------
      - uses: arduino/setup-arduino-cli@v2
        if: env.SKIP != '1'

      - name: Install ESP32 core and libraries
        if: env.SKIP != '1'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib update-index
          # Pinned so a library release can't break the build. RadioLib 8.x
          # changed begin() to take a config struct; the firmware uses the
          # 7.x API. Keep these the same as your Arduino IDE Library Manager.
          for lib in "RadioLib@7.8.1" "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.13.0" \
                     "Adafruit BusIO@1.17.4" "OneWire@2.3.8" "DallasTemperature@4.0.6"; do
            arduino-cli lib install "$lib"
          done
          arduino-cli lib list

      - name: Stamp firmware version
        if: env.SKIP != '1'
        run: |
          sed -i -E "s/^#define FW_VERSION \".*\"/#define FW_VERSION \"${VERSION}\"/" firmware/tank_node/tank_node.ino
          grep -n '^#define FW_VERSION' firmware/tank_node/tank_node.ino

      - name: Compile firmware
        if: env.SKIP != '1'
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build/fw --warnings default firmware/tank_node

      - name: Collect firmware parts
        if: env.SKIP != '1'
        run: |
          mkdir -p dist
          cp build/fw/tank_node.ino.bin            dist/fw_app.bin
          cp build/fw/tank_node.ino.bootloader.bin dist/fw_bootloader.bin
          cp build/fw/tank_node.ino.partitions.bin dist/fw_partitions.bin
          BOOT_APP0=$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/fw_boot_app0.bin
          ls -la dist

      # ---------- Windows tool ----------
      - uses: actions/setup-go@v5
        if: env.SKIP != '1'
        with:
          go-version: "1.24"

      - name: Build Watershed Tank Tool
        if: env.SKIP != '1'
        working-directory: tools/WatershedTankTool/src
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.appVersion=${VERSION} -X main.updateRepo=${GITHUB_REPOSITORY}" \
            -o "$GITHUB_WORKSPACE/dist/WatershedTankTool.exe" .

      # ---------- esptool (official Espressif build) ----------
      - name: Fetch esptool for Windows
        if: env.SKIP != '1'
        run: |
          curl -fsSL -o esptool.zip "https://github.com/espressif/esptool/releases/download/${ESPTOOL_VERSION}/esptool-${ESPTOOL_VERSION}-win64.zip"
          mkdir -p esptool_zip && unzip -q esptool.zip -d esptool_zip
          cp "$(find esptool_zip -name esptool.exe | head -1)" dist/esptool.exe
          ls -la dist/esptool.exe

      # ---------- publish ----------
      - name: Write manifest
        if: env.SKIP != '1'
        run: python3 tools/WatershedTankTool/make_manifest.py dist "$VERSION" "$TAG" release_notes.txt > dist/manifest.json && cat dist/manifest.json

      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release was drafted on the website: just attach the files
            gh release upload "$TAG" dist/* --clobber
          else
            NOTES_ARGS=(--notes-file release_notes.txt)
            [ -s release_notes.txt ] || NOTES_ARGS=(--generate-notes)
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Watershed $TAG" "${NOTES_ARGS[@]}"
          fi
