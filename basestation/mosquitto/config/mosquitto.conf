# Watershed base station - Mosquitto broker
# Local-LAN only for now (matches build phase 1 - "Phase 1 (now) - local only"
# in the Watershed doc). Anonymous access is fine while everything sits behind
# the home router with nothing port-forwarded; add authentication before any
# Phase 2 remote-access work exposes this beyond the LAN.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
